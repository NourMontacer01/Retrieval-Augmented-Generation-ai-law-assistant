<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Recueil de conformité — assistant RAG sur le droit européen des données et de l'IA">
  <style>
    .fond { fill: #f4efe4; }
    .encre { fill: #1f1b16; }
    .douce { fill: #5a5247; }
    .rouge { fill: #8b1e2d; }
    .filet { stroke: #1f1b16; }
    text { font-family: Georgia, 'Times New Roman', serif; }
    .titre { font-size: 46px; }
    .haut { font-size: 12.5px; letter-spacing: 2.5px; }
    .question { font-size: 19px; font-style: italic; opacity: 0; animation: cycle 12s infinite; }
    .q2 { animation-delay: 4s; }
    .q3 { animation-delay: 8s; }
    .fluo { fill: #f6e45c; opacity: 0; animation: cycle 12s infinite, balaye 4s infinite; transform-box: fill-box; transform-origin: left; }
    .f2 { animation-delay: 4s, 4s; }
    .f3 { animation-delay: 8s, 8s; }
    .sceau { animation: tourne 30s linear infinite; transform-origin: 812px 125px; }
    @keyframes cycle { 0% { opacity: 0; } 4%, 29% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes balaye { 0%, 8% { transform: scaleX(0); } 22%, 100% { transform: scaleX(1); } }
    @keyframes tourne { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .question, .fluo, .sceau { animation: none; }
      .q1, .f1 { opacity: 1; }
    }
  </style>

  <rect class="fond" width="900" height="250" rx="10"/>
  <line class="filet" x1="40" y1="30" x2="860" y2="30" stroke-width="3"/>
  <line class="filet" x1="40" y1="36" x2="860" y2="36" stroke-width="1"/>
  <text class="haut douce" x="40" y="58">DROIT DE L'UNION EUROPÉENNE</text>
  <text class="haut douce" x="860" y="58" text-anchor="end">RGPD · AI ACT · EPRIVACY · DATA ACT</text>

  <text class="titre encre" x="40" y="118">Recueil de conformité</text>

  <!-- questions qui defilent, la partie cle surlignee comme dans l'interface -->
  <rect class="fluo f1" x="550" y="146" width="180" height="27" rx="3"/>
  <text class="question encre q1" x="40" y="166">« Quand faut-il réaliser une AIPD ? »</text>
  <text class="question encre q1" x="560" y="166">→ RGPD, art. 35</text>
  <rect class="fluo f2" x="550" y="146" width="180" height="27" rx="3"/>
  <text class="question encre q2" x="40" y="166">« Quelles pratiques d'IA sont interdites ? »</text>
  <text class="question encre q2" x="560" y="166">→ AI Act, art. 5</text>
  <rect class="fluo f3" x="550" y="146" width="180" height="27" rx="3"/>
  <text class="question encre q3" x="40" y="166">« Mon site a été piraté : qui prévenir ? »</text>
  <text class="question encre q3" x="560" y="166">→ RGPD, art. 33</text>

  <line class="filet" x1="40" y1="206" x2="860" y2="206" stroke-width="1"/>
  <line class="filet" x1="40" y1="212" x2="860" y2="212" stroke-width="3"/>
  <text class="haut douce" x="40" y="234">NOUR MONTACER · MASTER DATA &amp; IA · ECE PARIS</text>

  <!-- sceau -->
  <g class="sceau">
    <circle cx="812" cy="125" r="44" fill="none" stroke="#8b1e2d" stroke-width="1.5"/>
    <circle cx="812" cy="125" r="37" fill="none" stroke="#8b1e2d" stroke-width="0.8" stroke-dasharray="3 4"/>
  </g>
  <text class="rouge" x="812" y="140" text-anchor="middle" font-size="40">§</text>
</svg>
